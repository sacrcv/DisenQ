# NTU RGB-AB: 106 actors, 94 single-person actions, 88.7k clips.
# Viewpoint is recorded, so all four protocol variants apply.
#
#   python tools/prepare_dataset.py --dataset ntu --frames-root data/ntu_rgb_ab/frames \
#       --out data/ntu_rgb_ab/annotations.json
#   python tools/generate_prompts.py --annotation data/ntu_rgb_ab/annotations.json \
#       --out data/ntu_rgb_ab/prompts.json
#   torchrun --nproc_per_node=4 train.py --cfg configs/ntu_rgb_ab.yaml

_base_: _base.yaml

data:
  annotation: data/ntu_rgb_ab/annotations.json
  prompts: data/ntu_rgb_ab/prompts.json
  num_frames: 8
  frame_stride: 4
  sampling: stride

run:
  output_dir: output/ntu_rgb_ab
  max_epoch: 60
  batch_size: 32
  batch_size_eval: 64
  protocols:
    - same_activity_include_view
    - same_activity_exclude_view
    - cross_activity_include_view
    - cross_activity_exclude_view
  primary_protocol: same_activity_include_view
  primary_metric: "R@1"
